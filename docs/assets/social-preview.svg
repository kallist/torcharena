<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<title>TorchArena — Train. Race. Break. Resume.</title>
<desc>PyTorch training workbench: two model lanes, a full-state checkpoint, and three CLI showcases. Schematic; no benchmark numbers.</desc>
<rect width="100%" height="100%" fill="#0c111b"/>
<text x="80" y="48" dominant-baseline="text-before-edge" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#7bddeb">PYTORCH / TRAINING WORKBENCH</text>
<text x="76" y="92" dominant-baseline="text-before-edge" font-family="Segoe UI, sans-serif" font-size="80" font-weight="700" fill="#edf2f7">TORCHARENA</text>
<text x="80" y="195" dominant-baseline="text-before-edge" font-family="Segoe UI, sans-serif" font-size="32" font-weight="400" fill="#ffb36b">Train. Race. Break. Resume.</text>
<text x="80" y="246" dominant-baseline="text-before-edge" font-family="Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#a8bbce">Compare models. Continue training. Inspect failures.</text>
